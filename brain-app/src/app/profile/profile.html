<div class="profile-page"><header><a routerLink="/" aria-label="Zurück">‹</a><h1>Profil</h1></header><main>
  @if(error()){<p class="message error" role="alert">{{error()}}</p>}@if(success()){<p class="message success" role="status">{{success()}}</p>}
  <section><h2>E-Mail-Adresse</h2><code>{{auth.session()?.user?.email}}</code></section>
  <form (ngSubmit)="saveProfile()"><h2>Anzeigename</h2><p>Dieser Name ist für andere Nutzer sichtbar.</p><input aria-label="Anzeigename" [ngModel]="username()" (ngModelChange)="username.set($event)" name="username" /><button [disabled]="saving()">Speichern</button></form>
  <section><h2>Dashboard-Kacheln</h2><p>Wähle einen globalen Stil für alle App-Kacheln.</p><div class="theme-options"><button type="button" [class.active]="tileTheme()==='colorful'" (click)="saveTheme('colorful')"><span class="color-preview"><i></i><i></i><i></i></span><b>Farbig</b></button><button type="button" [class.active]="tileTheme()==='monochrome'" (click)="saveTheme('monochrome')"><span class="mono-preview"><i></i><i></i><i></i></span><b>Schwarz-Weiß</b></button></div></section>
  <form (ngSubmit)="updatePassword()"><h2>Passwort ändern</h2><label>Neues Passwort<input type="password" minlength="6" placeholder="Mindestens 6 Zeichen" [ngModel]="password()" (ngModelChange)="password.set($event)" name="password" /></label><label>Passwort bestätigen<input type="password" placeholder="Passwort wiederholen" [ngModel]="confirmation()" (ngModelChange)="confirmation.set($event)" name="confirmation" /></label><button class="password-button" [disabled]="saving()">Passwort ändern</button></form>
</main></div>
