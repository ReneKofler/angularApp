<div class="page"><header><a routerLink="/" aria-label="Zurück">‹</a><h1>Journal</h1></header><main><section class="calendar"><div class="calendar-title"><button aria-label="Vorheriger Monat" (click)="changeMonth(-1)">‹</button><h2>{{monthLabel()}}</h2><button aria-label="Nächster Monat" (click)="changeMonth(1)">›</button></div><button class="today" (click)="today()">Heute</button><div class="weekdays"><span>Mo</span><span>Di</span><span>Mi</span><span>Do</span><span>Fr</span><span>Sa</span><span>So</span></div><div class="days">@for(day of days();track $index){@if(day){<button [class.selected]="day.key===selected()" [class.has-entry]="day.hasEntry" (click)="select(day.key)">{{day.day}}</button>}@else{<i></i>}}</div></section><section class="editor"><h2>{{selectedLabel()}}</h2>@if(error()){<p class="error" role="alert">{{error()}}</p>}@if(message()){<p class="success" role="status">{{message()}}</p>}<textarea aria-label="Journal-Eintrag" rows="12" placeholder="Was beschäftigt dich heute?" [ngModel]="content()" (ngModelChange)="content.set($event)"></textarea><div>@if(current()){<button class="delete" (click)="remove()">Löschen</button>}<button class="save" [disabled]="saving()" (click)="save()">Eintrag speichern</button></div></section></main></div>
