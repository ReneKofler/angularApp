<div class="page"><header><a routerLink="/" aria-label="Zurück">‹</a><h1>Journal</h1><button (click)="editor()?cancel():newEntry()">{{editor()?'Abbrechen':'+ Eintrag'}}</button></header><main>@if(error()){<p class="error" role="alert">{{error()}}</p>}@if(message()){<p class="success" role="status">{{message()}}</p>}@if(editor()){<form class="entry-form" (ngSubmit)="save()"><h2>{{editingId()?'Eintrag bearbeiten':'Neuer Eintrag'}}</h2><label>Datum<input type="date" required [ngModel]="date()" (ngModelChange)="date.set($event)" name="date"></label><label>Eintrag<textarea aria-label="Journal-Eintrag" rows="10" [ngModel]="content()" (ngModelChange)="content.set($event)" name="content"></textarea></label><div>@if(editingId()){<button class="delete" type="button" (click)="remove()">Löschen</button>}<button class="save" [disabled]="saving()">Eintrag speichern</button></div></form>}@else{<input class="search" aria-label="Einträge durchsuchen" placeholder="Einträge durchsuchen..." [ngModel]="search()" (ngModelChange)="search.set($event)"><section><h2>Meine Einträge</h2>@for(item of filtered();track item.id){<button class="entry" (click)="edit(item)"><time>{{formatDate(item.entry_date)}}</time><span>{{preview(item.content)}}</span></button>}@empty{<p class="empty">Keine Einträge gefunden.</p>}</section>}</main></div>
